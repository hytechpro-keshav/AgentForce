                    - generic [ref=f1e121]: The problem we solve
                    - heading "Great products. Fractured service." [level=2] [ref=f1e122]:
                        - text: Great products.
                        - text: Fractured service.
                - paragraph [ref=f1e123]:
                    - text: Most manufacturers build excellent hardware. Where they struggle is everything
                    - emphasis [ref=f1e124]: after the sale
                    - text: — the moments that decide whether a customer renews, refers and trusts the brand. Today those moments sprawl across a dozen disconnected tools.
            - generic [ref=f1e125]:
                - generic [ref=f1e126]:
                    - img [ref=f1e127]
                    - generic [ref=f1e129]: Cases arrive from everywhere
                    - generic [ref=f1e130]: Email, phone, portal, resellers and field escalations each land in a different system. Context is lost at every handoff.
                - generic [ref=f1e131]:
                    - img [ref=f1e132]
                    - generic [ref=f1e134]: Warranty data is scattered
                    - generic [ref=f1e135]: Agents can't tell in seconds whether a unit is in warranty, what its history is, or whether a known defect applies.
                - generic [ref=f1e136]:
                    - img [ref=f1e137]
                    - generic [ref=f1e139]: Skilled people do low-value work
                    - generic [ref=f1e140]: Technicians lose nearly a full working day each week to manual entry and paperwork — and about half of appointments don't go to plan.
                - generic [ref=f1e141]:
                    - img [ref=f1e142]
                    - generic [ref=f1e144]: Dispatch is a manual puzzle
                    - generic [ref=f1e145]: Matching tech to job across skills, geography, SLA and parts is done by hand, under pressure — and often wrong the first time.
                - generic [ref=f1e146]:
                    - img [ref=f1e147]
                    - generic [ref=f1e149]: Repairs & returns lose value
                    - generic [ref=f1e150]: Without disciplined RMA and depot flow, returned units sit in limbo, lose value daily, and never feed failure data back to engineering.
                - generic [ref=f1e151]:
                    - img [ref=f1e152]
                    - generic [ref=f1e154]: Leadership flies blind
                    - generic [ref=f1e155]: By the time a defect shows up in a monthly report, the damage — revenue, SLA credits, trust — is already done.
            - generic [ref=f1e156]:
                - generic [ref=f1e157]:
                    - text: Built to solve this cluster
                    - text: as one problem — because it is.
                - generic [ref=f1e158]: Fragmentation is the root cause of most service failures. Ablypro unifies the entire lifecycle onto one platform and one set of AI agents.

                    - generic [ref=f2e121]: The problem we solve
                    - heading "Great products. Fractured service." [level=2] [ref=f2e122]:
                        - text: Great products.
                        - text: Fractured service.
                - paragraph [ref=f2e123]:
                    - text: Most manufacturers build excellent hardware. Where they struggle is everything
                    - emphasis [ref=f2e124]: after the sale
                    - text: — the moments that decide whether a customer renews, refers and trusts the brand. Today those moments sprawl across a dozen disconnected tools.
            - generic [ref=f2e125]:
                - generic [ref=f2e126]:
                    - img [ref=f2e127]
                    - generic [ref=f2e129]: Cases arrive from everywhere
                    - generic [ref=f2e130]: Email, phone, portal, resellers and field escalations each land in a different system. Context is lost at every handoff.
                - generic [ref=f2e131]:
                    - img [ref=f2e132]
                    - generic [ref=f2e134]: Warranty data is scattered
                    - generic [ref=f2e135]: Agents can't tell in seconds whether a unit is in warranty, what its history is, or whether a known defect applies.
                - generic [ref=f2e136]:
                    - img [ref=f2e137]
                    - generic [ref=f2e139]: Skilled people do low-value work
                    - generic [ref=f2e140]: Technicians lose nearly a full working day each week to manual entry and paperwork — and about half of appointments don't go to plan.
                - generic [ref=f2e141]:
                    - img [ref=f2e142]
                    - generic [ref=f2e144]: Dispatch is a manual puzzle
                    - generic [ref=f2e145]: Matching tech to job across skills, geography, SLA and parts is done by hand, under pressure — and often wrong the first time.
                - generic [ref=f2e146]:
                    - img [ref=f2e147]
                    - generic [ref=f2e149]: Repairs & returns lose value
                    - generic [ref=f2e150]: Without disciplined RMA and depot flow, returned units sit in limbo, lose value daily, and never feed failure data back to engineering.
                - generic [ref=f2e151]:
                    - img [ref=f2e152]
                    - generic [ref=f2e154]: Leadership flies blind
                    - generic [ref=f2e155]: By the time a defect shows up in a monthly report, the damage — revenue, SLA credits, trust — is already done.
            - generic [ref=f2e156]:
                - generic [ref=f2e157]:
                    - text: Built to solve this cluster
                    - text: as one problem — because it is.
                - generic [ref=f2e158]: Fragmentation is the root cause of most service failures. Ablypro unifies the entire lifecycle onto one platform and one set of AI agents.

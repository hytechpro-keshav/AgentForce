        - generic [ref=f2e228]:
            - generic [ref=f2e229]:
                - generic [ref=f2e230]: The Ablypro approach
                - heading "It's not just five pillars — it's how they run." [level=2] [ref=f2e231]
                - paragraph [ref=f2e232]: A single agentic AI engine across the entire lifecycle, built natively on Salesforce. One data model. One set of agents. Coordinated action, grounded in real data.
            - generic [ref=f2e233]:
                - generic [ref=f2e234]:
                    - generic [ref=f2e235]: "01"
                    - generic [ref=f2e236]: Grounded in unified data
                    - generic [ref=f2e237]: CRM, asset telemetry, service history, warranty, parts and catalogs join into one data layer — so agents act on context, not guesses. One customer, one asset, one source of truth.
                - generic [ref=f2e238]:
                    - generic [ref=f2e239]: "02"
                    - generic [ref=f2e240]: Agents that reason and act
                    - generic [ref=f2e241]: "Beyond chat: triage a case, book a field visit end-to-end, reroute a tech when a job cancels, flag a parts shortage before it bites, start a secure recovery — autonomously."
                - generic [ref=f2e242]:
                    - generic [ref=f2e243]: "03"
                    - generic [ref=f2e244]: Trust, security & auditability
                    - generic [ref=f2e245]: Every autonomous action is permission-bound, logged and reversible. Sensitive steps carry human approval. Einstein-layer guardrails make agentic AI viable in regulated environments.
                - generic [ref=f2e246]:
                    - generic [ref=f2e247]: "04"
                    - generic [ref=f2e248]: Predictive, not reactive
                    - generic [ref=f2e249]: Because all five pillars feed one model, failure modes, demand signals and SLA risk surface early — so leadership acts before a defect becomes a recall or a churn event.

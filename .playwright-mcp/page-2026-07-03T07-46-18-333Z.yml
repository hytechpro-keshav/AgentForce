                - heading "It's not just five pillars — it's how they run." [level=2] [ref=e231]
                - paragraph [ref=e232]: A single agentic AI engine across the entire lifecycle, built natively on Salesforce. One data model. One set of agents. Coordinated action, grounded in real data.

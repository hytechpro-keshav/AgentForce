                    - generic [ref=e121]: The problem we solve
                    - heading "Great products. Fractured service." [level=2] [ref=e122]:
                        - text: Great products.
                        - text: Fractured service.
                - paragraph [ref=e123]:
                    - text: Most manufacturers build excellent hardware. Where they struggle is everything
                    - emphasis [ref=e124]: after the sale
                    - text: — the moments that decide whether a customer renews, refers and trusts the brand. Today those moments sprawl across a dozen disconnected tools.
            - generic [ref=e125]:
                - generic [ref=e126]:
                    - img [ref=e127]
                    - generic [ref=e129]: Cases arrive from everywhere
                    - generic [ref=e130]: Email, phone, portal, resellers and field escalations each land in a different system. Context is lost at every handoff.
                - generic [ref=e131]:
                    - img [ref=e132]
                    - generic [ref=e134]: Warranty data is scattered
                    - generic [ref=e135]: Agents can't tell in seconds whether a unit is in warranty, what its history is, or whether a known defect applies.
                - generic [ref=e136]:
                    - img [ref=e137]
                    - generic [ref=e139]: Skilled people do low-value work
                    - generic [ref=e140]: Technicians lose nearly a full working day each week to manual entry and paperwork — and about half of appointments don't go to plan.
                - generic [ref=e141]:
                    - img [ref=e142]
                    - generic [ref=e144]: Dispatch is a manual puzzle
                    - generic [ref=e145]: Matching tech to job across skills, geography, SLA and parts is done by hand, under pressure — and often wrong the first time.
                - generic [ref=e146]:
                    - img [ref=e147]
                    - generic [ref=e149]: Repairs & returns lose value
                    - generic [ref=e150]: Without disciplined RMA and depot flow, returned units sit in limbo, lose value daily, and never feed failure data back to engineering.
                - generic [ref=e151]:
                    - img [ref=e152]
                    - generic [ref=e154]: Leadership flies blind
                    - generic [ref=e155]: By the time a defect shows up in a monthly report, the damage — revenue, SLA credits, trust — is already done.
            - generic [ref=e156]:
                - generic [ref=e157]:
                    - text: Built to solve this cluster
                    - text: as one problem — because it is.
                - generic [ref=e158]: Fragmentation is the root cause of most service failures. Ablypro unifies the entire lifecycle onto one platform and one set of AI agents.
